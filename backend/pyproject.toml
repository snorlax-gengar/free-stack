[project]
name = "freestack"
version = "0.1.0"
description = "FreeStack API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freestack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
